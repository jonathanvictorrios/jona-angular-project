
<div>
  <h2>Titulos y competencias</h2>
  <section>
    <div class="example-button-row">
      <button matButton="filled"
        matTooltip="Agregar nuevo"
        aria-label="Button that displays a tooltip when focused or hovered over"
        routerLink="/create-titulo"
        >
        Agregar
      </button>
    </div>
  </section>
  <section>
    <mat-card class="example-card m-2" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
      </mat-card-header>
      <mat-card-content>
      <app-table [columnsNames] = "columnNames" [data] = "data"></app-table>
      </mat-card-content>
    </mat-card>
  </section>
</div>
